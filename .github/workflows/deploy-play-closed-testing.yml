name: Deploy til Google Play (Closed testing)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Hvad er nyt i denne version?"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sikrer at keytool/Gradle afkoder adgangskoder ens uanset hvilken
    # locale runner-imaget har som standard — vigtigst hvis en adgangskode
    # nogensinde indeholder ikke-ASCII tegn (fx æøå).
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      - name: Installér Dart-afhængigheder
        run: flutter pub get

      # .g.dart/.freezed.dart er gitignored og genereres derfor her, ligesom
      # man selv skal køre build_runner lokalt efter et checkout.
      - name: Generér kode (freezed/riverpod/json)
        run: dart run build_runner build

      # Keystore, key.properties og .env.prod indeholder alle hemmeligheder,
      # og genskabes derfor fra GitHub Secrets frem for at ligge i repoet.
      #
      # OBS: hemmeligheder sendes IKKE direkte ind i run:-scriptet via
      # ${{ secrets.X }} — de lægges i env: og læses ud som "$VAR" i bash.
      # Ellers ville bash selv forsøge at fortolke $-tegn, backticks og
      # backslashes i adgangskoden/nøglen, hvilket tavst ødelægger værdien
      # uden nogen fejl, hvis den indeholder sådan et tegn (meget almindeligt
      # i genererede adgangskoder).
      - name: Genskab keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # Fejler her på et par sekunder med en klar besked, hvis keystoren eller
      # adgangskoderne er forkerte, i stedet for at fejle efter et langt
      # Gradle-byg med en kryptisk fejl fra signerings-trinnet.
      - name: Validér keystore
        env:
          KEY_ALIAS: ${{ secrets.PLAY_KEYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_STORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
          || {
            echo "::error::Keystoren kunne ikke læses med de angivne secrets. Enten er PLAY_KEYSTORE_BASE64 korrupt, eller også matcher PLAY_KEYSTORE_KEY_ALIAS/PLAY_KEYSTORE_STORE_PASSWORD ikke keystoren. Genskab base64 lokalt med: base64 -i upload-keystore.jks | tr -d '\n' | pbcopy — og dobbelttjek at adgangskoderne er kopieret uden ekstra mellemrum/linjeskift."
            exit 1
          }

      - name: Skriv android/key.properties
        env:
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEYSTORE_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Skriv .env.prod
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_PUBLIC_KEY: ${{ secrets.PROD_SUPABASE_PUBLIC_KEY }}
        run: |
          cat > .env.prod <<EOF
          SUPABASE_URL=$PROD_SUPABASE_URL
          SUPABASE_PUBLIC_KEY=$PROD_SUPABASE_PUBLIC_KEY
          EOF

      # pubspec.yaml lister .env.dev som asset uanset flavor, så filen skal
      # eksistere for at bundlingen ikke fejler — indholdet er ligegyldigt,
      # da prod-builden aldrig læser den.
      - name: Skriv tom .env.dev (kræves som asset, bruges ikke i prod)
        run: touch .env.dev

      # github.run_number stiger automatisk ved hvert workflow-run, så
      # versionCode altid er unikt uden manuel indgriben.
      - name: Byg release App Bundle (prod)
        run: |
          flutter build appbundle \
            --flavor prod \
            -t lib/main_prod.dart \
            --release \
            --build-number=${{ github.run_number }}

      - name: Skriv release notes til Play-format
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p whatsnew
          # Play kræver maks. 500 tegn pr. sprog.
          printf '%s' "$RELEASE_NOTES" | head -c 500 > whatsnew/whatsnew-da-DK

      - name: Upload til Google Play (Closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dk.sciencecup.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: alpha
          status: completed
          whatsNewDirectory: whatsnew

      - name: Ryd op i hemmeligheder
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties .env.prod
