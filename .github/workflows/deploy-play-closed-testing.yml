name: Deploy til Google Play (Closed testing)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Hvad er nyt i denne version?"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      - name: Installér Dart-afhængigheder
        run: flutter pub get

      # .g.dart/.freezed.dart er gitignored og genereres derfor her, ligesom
      # man selv skal køre build_runner lokalt efter et checkout.
      - name: Generér kode (freezed/riverpod/json)
        run: dart run build_runner build

      # Keystore, key.properties og .env.prod indeholder alle hemmeligheder,
      # og genskabes derfor fra GitHub Secrets frem for at ligge i repoet.
      - name: Genskab keystore
        run: |
          echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Skriv android/key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.PLAY_KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.PLAY_KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.PLAY_KEYSTORE_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Skriv .env.prod
        run: |
          cat > .env.prod <<EOF
          SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_PUBLIC_KEY=${{ secrets.PROD_SUPABASE_PUBLIC_KEY }}
          EOF

      # github.run_number stiger automatisk ved hvert workflow-run, så
      # versionCode altid er unikt uden manuel indgriben.
      - name: Byg release App Bundle (prod)
        run: |
          flutter build appbundle \
            --flavor prod \
            -t lib/main_prod.dart \
            --release \
            --build-number=${{ github.run_number }}

      - name: Skriv release notes til Play-format
        run: |
          mkdir -p whatsnew
          # Play kræver maks. 500 tegn pr. sprog.
          printf '%s' "${{ inputs.release_notes }}" | head -c 500 > whatsnew/whatsnew-da-DK

      - name: Upload til Google Play (Closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dk.sciencecup.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: alpha
          status: completed
          whatsNewDirectory: whatsnew

      - name: Ryd op i hemmeligheder
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties .env.prod
